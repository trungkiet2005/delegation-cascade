[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcascade-egt"
version = "1.0.0"
description = "Delegation cascades in an evolutionary AI race"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "evolutionary game theory",
    "replicator dynamics",
    "delegation",
    "AI safety",
    "liability",
    "principal-agent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "egttools>=0.1.14",
    "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
